# BLE Observer (beacon scanning) + Peripheral (GATT config service)
CONFIG_BT=y
CONFIG_BT_OBSERVER=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="BLE_Password"
CONFIG_BT_LOG_LEVEL_WRN=y

# Large ATT MTU / data length: a full password fits in one GATT write, and
# SMP firmware upload runs at a usable speed.
CONFIG_BT_L2CAP_TX_MTU=498
CONFIG_BT_BUF_ACL_TX_SIZE=502
CONFIG_BT_BUF_ACL_RX_SIZE=502
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251

# Persist config in flash via the RAW flash API at the 'config_storage'
# partition (pm_static_*.yml).  Flash uses the default MPSL radio sync so SMP
# can erase/write the upload slot DURING a BLE connection; the config save
# still runs with bt_disable() as before.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y

# --- Firmware update: MCUboot + MCUmgr/SMP over BLE -----------------------
# MCUboot itself is enabled in sysbuild.conf.  SMP is locked by the app (see
# smp_gate_cb in main.c) unless DFU was armed with the button held.
CONFIG_ZCBOR=y
CONFIG_NET_BUF=y
CONFIG_CRC=y
CONFIG_MCUMGR=y
CONFIG_MCUMGR_TRANSPORT_BT=y
CONFIG_MCUMGR_TRANSPORT_BT_REASSEMBLY=y
CONFIG_MCUMGR_TRANSPORT_BT_CONN_PARAM_CONTROL=y
CONFIG_MCUMGR_TRANSPORT_NETBUF_SIZE=2475
CONFIG_MCUMGR_TRANSPORT_WORKQUEUE_STACK_SIZE=4608
CONFIG_MCUMGR_GRP_IMG=y
CONFIG_MCUMGR_GRP_OS=y
CONFIG_MCUMGR_GRP_OS_MCUMGR_PARAMS=y
CONFIG_MCUMGR_MGMT_NOTIFICATION_HOOKS=y
CONFIG_MCUMGR_SMP_COMMAND_STATUS_HOOKS=y
CONFIG_IMG_MANAGER=y
CONFIG_STREAM_FLASH=y
# SMP "reset" after an upload.
CONFIG_REBOOT=y

# USB HID — new stack (avoids dual-stack linker conflict seen on nRF52840 Dongle)
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USB_DEVICE_STACK=n
CONFIG_USBD_HID_SUPPORT=y
CONFIG_USBD_LOG_LEVEL_WRN=y
CONFIG_USBD_HID_LOG_LEVEL_WRN=y
CONFIG_UDC_DRIVER_LOG_LEVEL_WRN=y
CONFIG_SAMPLE_USBD_PID=0x0008

# GPIO + button input subsystem
CONFIG_GPIO=y
CONFIG_INPUT=y
CONFIG_INPUT_MODE_SYNCHRONOUS=y

# Logging — disabled; CDC ACM serial removed so USB is HID-only
# (CDC ACM composite with HID is unstable on this dongle / next USB stack).
CONFIG_LOG=n
CONFIG_UART_CONSOLE=n
CONFIG_BOARD_SERIAL_BACKEND_CDC_ACM=n

# Larger stacks for BLE + USB combo
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
