# Board-specific config for the 3rd-party Raytac MDBT50Q-RX dongle
# (built on the nrf52840dk target, flashed via J-Link).

# The module's 32.768 kHz crystal is optional / may not be populated, and the
# DK target defaults to the external crystal (LFXO).  Use the internal RC
# oscillator so BLE's low-frequency clock starts without a crystal — otherwise
# bt_enable() stalls and the app never reaches the config window.
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y

# Debug logging over SEGGER RTT (read with J-Link; this board has SWD).
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_UART=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n

# MCUboot + MCUmgr/SMP (firmware update over BLE) are common to both boards:
# see prj.conf, sysbuild.conf and sysbuild/mcuboot/.
